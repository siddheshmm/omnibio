display_name: Dual Channel LED Cycle

automation_name: dual_channel_led_cycle

description: >
  Sequential LED scheduling automation.
  Channel C turns ON first for its configured duration,
  followed by a dark gap, then Channel D turns ON,
  followed by another dark gap, and the cycle repeats.
  Only one LED channel is active at a time.

fields:

  # ─────────────────────────────────────────────
  # CHANNEL C
  # ─────────────────────────────────────────────

  - key: channel_C_intensity
    default: 50
    unit: "%"
    label: "Channel C LED intensity"

  - key: channel_C_duration_min
    default: 180
    unit: min
    label: "Channel C ON duration"

  # ─────────────────────────────────────────────
  # CHANNEL D
  # ─────────────────────────────────────────────

  - key: channel_D_intensity
    default: 50
    unit: "%"
    label: "Channel D LED intensity"

  - key: channel_D_duration_min
    default: 180
    unit: min
    label: "Channel D ON duration"

  # ─────────────────────────────────────────────
  # GAP BETWEEN CHANNELS
  # ─────────────────────────────────────────────

  - key: gap_duration_min
    default: 60
    unit: min
    label: "Dark gap duration"

  # ─────────────────────────────────────────────
  # REPEAT CYCLE COUNT
  # ─────────────────────────────────────────────

  - key: repeat_cycle
    default: 1
    unit: null
    label: "Number of full cycles to run"
