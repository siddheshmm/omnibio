display_name: Dual Channel LED Cycle
automation_name: dual_channel_led_cycle
description: >
  Independent ON/OFF cycles for two LED channels with separate intensities.
  Set intensity to 0 to keep a channel dark regardless of its timer.
  All settings are adjustable live during the experiment.

fields:
  # ── Channel C ───────────────────────────────────────────────
  - key: channel_C_intensity
    default: 50
    unit: "%"
    label: "C LED intensity"

  - key: channel_C_on_duration_min
    default: 180
    unit: min
    label: "C LED ON duration"

  - key: channel_C_off_duration_min
    default: 60
    unit: min
    label: "C LED OFF duration"

  # ── Channel D ──────────────────────────────────────────────
  - key: channel_D_intensity
    default: 50
    unit: "%"
    label: "D LED intensity"

  - key: channel_D_on_duration_min
    default: 180
    unit: min
    label: "D LED ON duration"

  - key: channel_D_off_duration_min
    default: 60
    unit: min
    label: "D LED OFF duration"